# بناء APK غير موقَّع لتطبيق المعهد بأدوات Google الرسمية. لا أسرار هنا: التوقيع خارج CI.
name: apk

on:
  push:
    branches: [main, apk-build]
  workflow_dispatch:

permissions:
  contents: write   # لنشر ملفات البناء كإصدار تجريبي (بإذن حسان 2026-11-21)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BT_VER: "36.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0"

      - name: Install API 37 platform (official sdkmanager)
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; [ -x "$SM" ] || SM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          "$SM" --list 2>/dev/null | grep -oE "platforms;android-3[6-9][^ |]*" | sort -u | tee /tmp/plats.txt
          PKG=$(grep -E "^platforms;android-37(\.0)?$" /tmp/plats.txt | head -1)
          [ -n "$PKG" ] || { echo "no API 37 platform"; exit 1; }
          yes | "$SM" "$PKG" >/dev/null
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build release (unsigned, R8)
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Lint (report only)
        continue-on-error: true
        run: gradle --no-daemon lintRelease

      - name: Zipalign and collect
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BT_VER"
          mkdir -p dist
          IN=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" dist/ibh-1.2.0-5-unsigned-aligned.apk
          "$BT/zipalign" -c -p 4 dist/ibh-1.2.0-5-unsigned-aligned.apk
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
          cp "$BT/aapt2" dist/aapt2
          cp "$BT/zipalign" dist/zipalign
          cp app/build/outputs/mapping/release/mapping.txt dist/ 2>/dev/null || true
          cp app/build/reports/lint-results-release.html dist/ 2>/dev/null || true
          cp app/build/reports/lint-results-release.txt dist/ 2>/dev/null || true
          "$BT/aapt2" dump badging dist/ibh-1.2.0-5-unsigned-aligned.apk > dist/badging.txt
          {
            echo "java: $(java -version 2>&1 | head -1)"
            echo "gradle: $(gradle --version | grep '^Gradle')"
            echo "build-tools: $BT_VER"
            echo "platform: $(cat $ANDROID_HOME/platforms/android-37/source.properties 2>/dev/null | tr '\n' ' ')"
            echo "agp: $(grep -o 'com.android.application\") version \"[^\"]*' build.gradle.kts)"
          } > dist/versions.txt
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/versions.txt dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ibh-apk-unsigned
          path: dist/
          retention-days: 14

      - name: Publish build files as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --prerelease \
            --title "بناء رسمي غير موقَّع ${{ github.run_number }}" \
            --notes "ملفات البناء بأدوات Google الرسمية، قبل التوقيع. ليست للتثبيت؛ النسخة الموقّعة تُوزَّع من المنصة."
